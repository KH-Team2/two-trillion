# Spring Boot 서버 실행 포트
server:
  port: ${SERVER_PORT:8080}

# Spring Boot 프로젝트 이름
spring:
  application:
    name: hope-refund-backend
# [수정 11/20 고은] 정수 칸(금액 · 인원 등)에 소수(예: 1.5)가 오면 거부 (400)
# 이유: 기본 설정은 소수점을 몰래 버리고 1로 저장해서, 잘못 입력한 값이 그대로 들어감	
  jackson:
    deserialization:
      accept-float-as-int: false
# DB 접속 정보 등은 backend 폴더의 .env 파일에서도 읽음 (.env는 커밋하지 않음 · 항목 이름은 .env.example 참고)
# 환경변수(STS Run Configurations)로 넣어도 되고, .env 파일로 넣어도 됨. 둘 다 있으면 환경변수가 우선.
  config:
    import: optional:file:.env[.properties]
# 오류 응답에 내부 정보 노출 방지
  web:
    error:
      include-stacktrace: never
# [추가 11/17 고은] 카드 · 홈택스 파일 업로드 크기 (POST /api/card-uploads)
# 이유: 설정이 없으면 스프링 기본값 1MB라, 카드사 원본처럼 칸이 많은 파일은 1만 행(계산 서버 한도)보다 먼저 막힘
#   · max-file-size: 파일 1개 최대 크기 · max-request-size: 요청 전체 최대 크기(파일 + 결제수단 등 다른 칸)
#   · 넘으면 공통 처리기가 413 PAYLOAD_TOO_LARGE 「파일이 너무 커요」로 응답
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Oracle DB 연결 설정
# 실제 접속 정보는 로컬 환경변수에서 가져옴.
# 환경 변수 설정 Run → Run Configurations → Spring Boot App → 해당 프로젝트 → Environment → add
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
# 메일 서버(SMTP) 접속 정보 · 회원가입 인증번호 메일 (MAIL_MODE=smtp 일 때만 실제로 씀 · member/client/SmtpEmailSender)
# Gmail 은 계정 비밀번호가 아니라 「앱 비밀번호」(16자리)를 MAIL_PASSWORD 에 넣는다 · 값은 .env 에만
# 제한 시간(ms): 연결 3초 · 읽기/쓰기 5초 → 메일 서버가 느려도 요청이 오래 붙잡히지 않게
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# MyBatis Mapper XML 및 컬럼 매핑 설정
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
# ex. MEMBER_ID → memberId 자동 매핑
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

# 회원가입 이메일 인증 설정
# dev-code-enabled: 개발 환경에서만 EMAIL_DEV_CODE_ENABLED=true로 켜서 인증번호를 발송 API 응답(devCode)에 담는다.
#                   MAIL_MODE=log(메일 안 보냄)로 개발할 때 쓴다. 운영에서는 반드시 false (기본값).
member:
  # 메일 발송 방식 (member/client/EmailSender · CALC_MODE 와 같은 구조)
  #   log: 메일을 보내지 않고 로그만 (기본값 · SMTP 계정 없이 개발) · smtp: 실제 발송 (spring.mail 설정 필요)
  # from: 보내는 사람 주소 · 비우면 MAIL_USERNAME (smtp인데 둘 다 비면 서버가 켜지지 않음)
  mail:
    mode: ${MAIL_MODE:log}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  email-verification:
    dev-code-enabled: ${EMAIL_DEV_CODE_ENABLED:false}
    # 가입 때 이메일 인증을 꼭 마쳐야 하는지 · 기본 false (화면 인증 UI도 숨김)
    # MAIL_MODE=smtp 로 실제 발송이 되면 true로 켜고 frontend/.env 의 VITE_EMAIL_VERIFICATION_REQUIRED=true 도 같이
    required: ${EMAIL_VERIFICATION_REQUIRED:false}
# 로그인 잠금 (F-01-02): 5번 연속 틀리면 10분 잠금 · false면 잠금 · 실패 횟수 기록을 하지 않음
  login-lock:
    enabled: ${LOGIN_LOCK_ENABLED:true}

# 로그인 토큰(JWT) 설정 (common/service/TokenService · decisions/0004)
# JWT_SECRET: 32바이트 이상 · .env에만 쓰고 커밋 금지 (없거나 짧으면 서버가 켜지지 않음) · CALC_API_TOKEN과 다른 값
# 리프레시 토큰은 쓰지 않음 → 만료되면 다시 로그인
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:2h}

# Python 계산 서버 연결 설정
# prediction/client/HttpCalcClient가 사용 (X-Calc-Token 헤더 · 연결·응답 제한 시간)
calc:
# mock: 가짜 계산(파이썬 서버 없이 화면 연결용 · 세액 0) · http: 파이썬 계산 서버 호출
  mode: ${CALC_MODE:mock}
  base-url: ${CALC_BASE_URL:http://localhost:8000}
  api-token: ${CALC_API_TOKEN:}
  connect-timeout: 3s ## 시간 설정들은 개발하면서 맞게 수정 필요 임의로 해둔 것.
  read-timeout: 10s

# 계산 결과 저장 (PREDICTION · PREDICTION_INPUT · PREDICTION_DETAIL)
# 파이썬 서버 연결 전에는 false (가짜 결과가 공용 DB에 쌓이지 않게) · calc.mode가 http일 때만 실제로 저장함
prediction:
  save-enabled: ${SAVE_ENABLED:false}

# Python FAQ 챗봇 서버 연결 설정
# FastAPI FAQ 조회 및 Gemma 3 기반 FAQ ID 분류에 사용
# X-Chatbot-Token 내부 인증을 사용하며, CHATBOT_API_TOKEN은 chatbot/.env와 같은 값으로 설정
chatbot: 
  base-url: ${CHATBOT_BASE_URL:http://localhost:8001}
  api-token: ${CHATBOT_API_TOKEN:}
  connect-timeout: 3s
  faq-read-timeout: 5s
  read-timeout: 60s
